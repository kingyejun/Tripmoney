<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c9fe0">
<title>여행 자금 플래너</title>
<meta name="description" content="해외여행 경비를 예측하고, 얼마를 어떻게 모아서 어떻게 쓸지 계산해 주는 플래너">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231c9fe0'/%3E%3Cpath fill='white' transform='rotate(45 12 12)' d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="flyer" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="46" height="46"><path fill="#fff" transform="rotate(90 12 12)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
  </div>
  <div class="hero-text">
    <h1>여행 자금 플래너</h1>
    <p>얼마나 필요한지, 어떻게 모을지, 어떻게 쓸지 한 번에</p>
  </div>
</header>

<div class="wrap">
  <section id="pass" aria-label="여행 요약"></section>
  <nav class="tabs" role="tablist" id="tabs" aria-label="메뉴"></nav>
  <main id="main"></main>
  <footer class="foot">
    <p>예산 기본값은 대략적인 참고 금액이에요. 항공권·숙소는 실제 가격을 입력하면 더 정확해져요. 모든 데이터는 이 기기의 브라우저에만 저장돼요.</p>
    <div class="foot-btns">
      <button class="btn ghost sm" data-act="export">백업 저장</button>
      <label class="btn ghost sm" for="import-file">백업 불러오기</label>
      <input type="file" id="import-file" accept="application/json" hidden>
      <button class="btn ghost sm" data-act="reset">전체 초기화</button>
    </div>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
